<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 48 48" role="img" aria-label="Prometeo Agent">
  <defs>
    <linearGradient id="promFire" x1="0.15" y1="1" x2="0.55" y2="0.05">
      <stop offset="0" stop-color="#5A0A0C"/>
      <stop offset=".45" stop-color="#C21C17"/>
      <stop offset="1" stop-color="#F5392B"/>
    </linearGradient>
    <linearGradient id="promDark" x1="0" y1="1" x2="0.4" y2="0">
      <stop offset="0" stop-color="#3E0708"/>
      <stop offset="1" stop-color="#8E1214"/>
    </linearGradient>
    <linearGradient id="promBright" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E63328"/>
      <stop offset="1" stop-color="#FF6A55"/>
    </linearGradient>
  </defs>

  <!-- agentic layer: tilted orbit + nodes -->
  <ellipse cx="24" cy="27" rx="20" ry="8.4" transform="rotate(-24 24 27)"
           fill="none" stroke="#17BFB0" stroke-width="1.7"/>

  <!-- faceted flame (Prometeo): two peaks -->
  <path d="M28 4 L32.5 20 C34.6 26,34 30.5,30 34.5 L24 45 L18 35.5
           C15.3 31,15 26,16.8 21 L16.2 14.5 L21 21 Z" fill="url(#promFire)"/>
  <path d="M24 45 L18 35.5 C15.3 31,15 26,16.8 21 L16.2 14.5 L21 21
           C22 30,23 38,24 45 Z" fill="url(#promDark)"/>
  <path d="M28 4 L32.5 20 C34.6 26,34 30.5,30 34.5 L24 45
           C25 34,26 20,28 4 Z" fill="url(#promBright)"/>

  <!-- agent nodes, on the orbit -->
  <g fill="#17BFB0">
    <circle cx="42.3" cy="18.9" r="3.1"/>
    <circle cx="5.7" cy="35.1" r="2.2"/>
    <circle cx="27.4" cy="34.7" r="1.7" opacity=".85"/>
  </g>
  <circle cx="42.3" cy="18.9" r="1.25" fill="#0C0E13"/>
</svg>
